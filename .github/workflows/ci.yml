name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prettier --check "src/**/*.{ts,tsx}"
      - run: npm test
      # Placeholder env: validation passes, nothing is secret or reachable.
      # Deliberately not set on `npm test`, so database tests skip in CI.
      - run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          BETTER_AUTH_SECRET: ci-only-4f9c2a7e1b8d3c6f0a5e9b2d7c1f4a8e
          BETTER_AUTH_URL: http://localhost:3100
          GOOGLE_CLIENT_ID: ci
          GOOGLE_CLIENT_SECRET: ci
          GITHUB_CLIENT_ID: ci
          GITHUB_CLIENT_SECRET: ci
          RESEND_API_KEY: re_ci
          EMAIL_FROM: ReelPilot <ci@example.com>
          NEXT_PUBLIC_APP_URL: http://localhost:3100

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          BETTER_AUTH_SECRET: ci-only-4f9c2a7e1b8d3c6f0a5e9b2d7c1f4a8e
          BETTER_AUTH_URL: http://localhost:3100
          GOOGLE_CLIENT_ID: ci
          GOOGLE_CLIENT_SECRET: ci
          GITHUB_CLIENT_ID: ci
          GITHUB_CLIENT_SECRET: ci
          RESEND_API_KEY: re_ci
          EMAIL_FROM: ReelPilot <ci@example.com>
          NEXT_PUBLIC_APP_URL: http://localhost:3100
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
