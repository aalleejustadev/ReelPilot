name: CI

on:
  push:
    branches: [main]
  pull_request:

# Shared by both jobs. Only DATABASE_URL points somewhere real (the Postgres
# service container below); everything else is a placeholder that passes env
# validation. The e2e tests never contact Google, GitHub or Resend.
env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reelpilot
  DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/reelpilot
  BETTER_AUTH_SECRET: ci-only-4f9c2a7e1b8d3c6f0a5e9b2d7c1f4a8e
  BETTER_AUTH_URL: http://localhost:3100
  GOOGLE_CLIENT_ID: ci
  GOOGLE_CLIENT_SECRET: ci
  GITHUB_CLIENT_ID: ci
  GITHUB_CLIENT_SECRET: ci
  RESEND_API_KEY: re_ci
  EMAIL_FROM: ReelPilot <ci@example.com>
  NEXT_PUBLIC_APP_URL: http://localhost:3100

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reelpilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prettier --check "src/**/*.{ts,tsx}"
      # Fresh database: apply every migration exactly as production would.
      - run: npx prisma migrate deploy
      # Includes the database tests (they run whenever DATABASE_URL is set).
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reelpilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx prisma migrate deploy
      # Includes the signed-in tests (fixture creates users in this database).
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
